[project]
name = "image-ai-studio"
version = "0.0.1"
description = "Phase 0 technical spike: Python PyTorch model -> C++ deployment (TorchScript vs AOTInductor)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
